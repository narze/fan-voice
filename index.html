<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>พูดใส่พัดลม - Fan Voice</title>
<style>
  :root { --sky: #8ec3e6; --ink: #1f3fae; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, "Noto Sans Thai", sans-serif;
    background: linear-gradient(#8ec3e6, #eef3f7 70%); color: #1b2533;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 520px; text-align: center; }
  h1 { color: var(--ink); font-size: 2.4rem; margin: 0 0 4px; letter-spacing: .02em; }
  h1 span { display: inline-block; animation: wobble .12s infinite alternate; }
  p.sub { margin: 0 0 20px; opacity: .75; }
  @keyframes wobble { from { transform: translateY(-1px); } to { transform: translateY(1px); } }

  .fan { width: min(340px, 80vw); aspect-ratio: 1; margin: 0 auto 16px; position: relative; }
  .fan svg { width: 100%; height: 100%; }

  .speeds { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .speeds button {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid #b8c4d0;
    background: #fff; font-size: 1.2rem; font-weight: 700; cursor: pointer; color: #45505e;
  }
  .power { max-width: 360px; margin: -4px auto 16px; background: #fffc; border-radius: 999px; padding: 4px 16px; }
  .power label { grid-template-columns: 56px 1fr 60px; margin: 4px 0; font-weight: 600; }
  .btn.start { display: block; width: 100%; max-width: 360px; margin: 0 auto 6px; padding: 18px 24px; font-size: 1.3rem; border-radius: 999px;
    box-shadow: 0 6px 18px #1f3fae55; animation: pulse 1.6s infinite; }
  .btn.start:hover { filter: brightness(1.1); }
  .btn.start.on { animation: none; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); font-size: 1.05rem; padding: 12px 24px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #1f3fae88; } 70% { box-shadow: 0 0 0 16px #1f3fae00; } 100% { box-shadow: 0 0 0 0 #1f3fae00; } }
  .speeds button.on { border-color: var(--ink); background: var(--ink); color: #fff; }

  .card { background: #fffc; border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: left; }
  label { display: grid; grid-template-columns: 110px 1fr 52px; align-items: center; gap: 8px; margin: 8px 0; font-size: .95rem; }
  label output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 18px; font-size: 1rem; font-weight: 600;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  .btn.alt { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .btn.rec { background: #d6334a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .check { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; font-size: .9rem; }
  .hint { font-size: .85rem; opacity: .7; text-align: center; margin: 8px 0 0; }
  #status { min-height: 1.4em; font-size: .9rem; color: var(--ink); text-align: center; margin: 8px 0; }
  audio { width: 100%; margin-top: 10px; }
  .modes { display: flex; background: #e3eaf1; border-radius: 999px; padding: 4px; margin-bottom: 12px; }
  .modes button { flex: 1; border: 0; border-radius: 999px; padding: 10px; font-size: .95rem; font-weight: 600; background: none; color: #45505e; cursor: pointer; }
  .modes button.on { background: var(--ink); color: #fff; }
  .meter { position: relative; height: 10px; border-radius: 5px; background: #e3eaf1; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: #4caf7a; }
  .meter b { position: absolute; top: 0; bottom: 0; width: 2px; background: #d6334a; }
  .advanced summary { cursor: pointer; font-weight: 600; color: #45505e; }
  .advanced[open] summary { margin-bottom: 8px; }
  [hidden] { display: none !important; }
  canvas { width: 100%; height: 70px; display: block; border-radius: 10px; background: #1b2533; }
</style>
</head>
<body>
<main>
  <h1><span>อ</span><span style="animation-delay:.06s">า</span>~~~</h1>
  <p class="sub">พูดใส่พัดลม Simulator</p>

  <div class="fan" aria-hidden="true">
    <svg viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="100" fill="#ffffff88" stroke="#9fb3c8" stroke-width="4" />
      <g id="blades" fill="#7aa7d6" stroke="#4b79b0" stroke-width="2">
        <path d="M110 110 C 95 60, 120 20, 140 30 C 155 40, 135 80, 110 110 Z" />
        <path d="M110 110 C 95 60, 120 20, 140 30 C 155 40, 135 80, 110 110 Z" transform="rotate(120 110 110)" />
        <path d="M110 110 C 95 60, 120 20, 140 30 C 155 40, 135 80, 110 110 Z" transform="rotate(240 110 110)" />
      </g>
      <g stroke="#9fb3c8" stroke-width="1.5" fill="none">
        <circle cx="110" cy="110" r="70" /><circle cx="110" cy="110" r="40" />
        <line x1="10" y1="110" x2="210" y2="110" /><line x1="110" y1="10" x2="110" y2="210" />
        <line x1="39" y1="39" x2="181" y2="181" /><line x1="181" y1="39" x2="39" y2="181" />
      </g>
      <circle cx="110" cy="110" r="14" fill="#dfe7ef" stroke="#9fb3c8" stroke-width="3" />
    </svg>
  </div>

  <div class="speeds" role="group" aria-label="Fan speed">
    <button data-speed="1" class="on">1</button>
    <button data-speed="2">2</button>
    <button data-speed="3">3</button>
    <button id="autoBtn" title="Auto: speed goes up and down by itself" aria-label="Auto">A</button>
  </div>
  <div class="power">
    <label>Power <input id="rate" type="range" min="4" max="40" step="0.5" value="12" /><output id="rateOut"></output></label>
  </div>
  <button id="micBtn" class="btn start">🎤 Start mic</button>
  <div id="status"></div>

  <details class="card advanced">
    <summary>Advanced</summary>
    <label>Chop depth <input id="depth" type="range" min="0" max="1" step="0.01" value="0.85" /><output id="depthOut"></output></label>
    <label>Pitch wobble <input id="wobble" type="range" min="0" max="1" step="0.01" value="0.35" /><output id="wobbleOut"></output></label>
    <label>Wind noise <input id="wind" type="range" min="0" max="1" step="0.01" value="0.25" /><output id="windOut"></output></label>
    <canvas id="scope" width="480" height="70"></canvas>
  </details>

  <div class="card">
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="talkback" class="on">Talk-back</button>
      <button data-mode="live">Live</button>
    </div>
    <div id="talkbackOpts">
      <label>Voice level <div class="meter"><i id="level"></i><b id="threshMark"></b></div><output></output></label>
      <label>Threshold <input id="thresh" type="range" min="0.005" max="0.2" step="0.005" value="0.03" /><output id="threshOut"></output></label>
    </div>
    <div class="row">
      <button id="recBtn" class="btn rec" disabled>● Record</button>
      <label class="btn alt" style="display:inline-block;margin:0;grid-template-columns:none">
        📁 Audio file <input id="file" type="file" accept="audio/*" hidden />
      </label>
    </div>
    <div class="check" id="monitorRow"><input id="monitor" type="checkbox" /> <span>Live monitor (use headphones!)</span></div>
    <audio id="player" controls hidden></audio>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script src="vad.js"></script>
<script>
// Fan speed presets: chop rate in Hz (3 blades x revolutions per second, perceived)
const SPEEDS = [0, 12, 19, 28];

const $ = (id) => document.getElementById(id);
const ui = {
  rate: $("rate"), depth: $("depth"), wobble: $("wobble"), wind: $("wind"),
  micBtn: $("micBtn"), recBtn: $("recBtn"), file: $("file"), monitor: $("monitor"),
  status: $("status"), player: $("player"), scope: $("scope"), blades: $("blades"),
  talkbackOpts: $("talkbackOpts"), thresh: $("thresh"), level: $("level"), threshMark: $("threshMark"),
  monitorRow: $("monitorRow"), hint: $("hint"),
};
const HINTS = {
  live: "Pick fan speed 1-3, then talk. Record to hear the result without feedback.",
  talkback: "Talk, then stop. After a short silence, the app plays your voice back through the fan. No headphones needed.",
};

let mode = "talkback";
let capture, vad, tbPlaying = false, tbSource, tbIgnoreUntil = 0;

let ctx, nodes, micStream, micSource, fileSource, recorder, chunks = [];

function buildGraph() {
  ctx = new AudioContext();
  const input = ctx.createGain();            // all sources connect here

  // Pitch wobble: modulated delay line (vibrato from moving blades / Doppler)
  const delay = ctx.createDelay(0.05);
  delay.delayTime.value = 0.006;
  const wobbleAmt = ctx.createGain();

  // Amplitude chop: blades cut the air path between mouth and ear
  const chop = ctx.createGain();
  const chopAmt = ctx.createGain();

  // Muffling that moves with the blades
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.Q.value = 0.7; lp.frequency.value = 6000;
  const lpAmt = ctx.createGain();

  // LFO: triangle reads as blade passes better than a pure sine
  const lfo = ctx.createOscillator();
  lfo.type = "triangle";
  lfo.connect(chopAmt).connect(chop.gain);
  lfo.connect(wobbleAmt).connect(delay.delayTime);
  lfo.connect(lpAmt).connect(lp.frequency);
  lfo.start();

  // Fan wind: looped noise, band-passed, also chopped by the blades
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf; noise.loop = true;
  const noiseBp = ctx.createBiquadFilter();
  noiseBp.type = "bandpass"; noiseBp.frequency.value = 500; noiseBp.Q.value = 0.6;
  const windGain = ctx.createGain();
  noise.connect(noiseBp).connect(windGain).connect(chop);
  noise.start();

  const out = ctx.createGain();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  const monitorGain = ctx.createGain();
  monitorGain.gain.value = 0;
  const recDest = ctx.createMediaStreamDestination();

  input.connect(delay).connect(lp).connect(chop).connect(out);
  out.connect(analyser);
  out.connect(recDest);
  out.connect(monitorGain).connect(ctx.destination);

  nodes = { input, delay, wobbleAmt, chop, chopAmt, lp, lpAmt, lfo, windGain, out, analyser, monitorGain, recDest };
  applyParams();
  drawScope();
}

function applyParams() {
  const rate = +ui.rate.value, depth = +ui.depth.value, wobble = +ui.wobble.value, wind = +ui.wind.value;
  $("rateOut").value = rate + " Hz";
  markPreset();
  $("depthOut").value = Math.round(depth * 100) + "%";
  $("wobbleOut").value = Math.round(wobble * 100) + "%";
  $("windOut").value = Math.round(wind * 100) + "%";
  bladeSpeed = rate;
  if (!nodes) return;

  const on = rate > 0, t = ctx.currentTime, tc = 0.05;
  nodes.lfo.frequency.setTargetAtTime(Math.max(rate, 1), t, tc);
  // gain = 1 - depth/2 +/- depth/2  -> swings between 1 and 1 - depth
  nodes.chop.gain.setTargetAtTime(on ? 1 - depth / 2 : 1, t, tc);
  nodes.chopAmt.gain.setTargetAtTime(on ? depth / 2 : 0, t, tc);
  // Max +/-1.5 ms delay swing, scaled down at high rates to keep pitch shift sane
  nodes.wobbleAmt.gain.setTargetAtTime(on ? wobble * 0.0015 * Math.min(1, 15 / rate) : 0, t, tc);
  nodes.lp.frequency.setTargetAtTime(on ? 3500 : 12000, t, tc);
  nodes.lpAmt.gain.setTargetAtTime(on ? 2000 * depth : 0, t, tc);
  nodes.windGain.gain.setTargetAtTime(on ? wind * 0.12 * (rate / 28) : 0, t, tc);
}

async function ensureCtx() {
  if (!ctx) buildGraph();
  if (ctx.state === "suspended") await ctx.resume();
}

async function toggleMic() {
  await ensureCtx();
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micSource.disconnect(); micStream = null; micSource = null;
    stopTalkbackPlayback();
    if (mode === "talkback") nodes.monitorGain.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
    ui.micBtn.textContent = "🎤 Start mic";
    ui.micBtn.classList.remove("on");
    ui.recBtn.disabled = !fileSource;
    ui.status.textContent = "";
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (e) {
    ui.status.textContent = "Mic error: " + e.message;
    return;
  }
  micSource = ctx.createMediaStreamSource(micStream);
  await routeMic();
  ui.micBtn.textContent = "■ Stop mic";
  ui.micBtn.classList.add("on");
  ui.recBtn.disabled = false;
}

// Live: mic goes straight into the fan effect.
// Talk-back: mic only feeds the capture worklet; clips play back through the effect.
async function routeMic() {
  if (!micSource) return;
  micSource.disconnect();
  stopTalkbackPlayback();
  if (mode === "live") {
    micSource.connect(nodes.input);
    setMonitor();
    ui.status.textContent = "Mic on - say อาาาาา~";
    return;
  }
  await ensureCapture();
  vad = createVad({ sampleRate: ctx.sampleRate, threshold: +ui.thresh.value });
  micSource.connect(capture);
  nodes.monitorGain.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
  ui.status.textContent = "Listening... say something";
}

// AudioWorklet that posts raw mic samples in ~23 ms batches
async function ensureCapture() {
  if (capture) return;
  const code = `
    class Capture extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Float32Array(1024); this.n = 0; }
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) for (let i = 0; i < ch.length; i++) {
          this.buf[this.n++] = ch[i];
          if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice()); this.n = 0; }
        }
        return true;
      }
    }
    registerProcessor("capture", Capture);`;
  const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
  await ctx.audioWorklet.addModule(url);
  capture = new AudioWorkletNode(ctx, "capture");
  const sink = ctx.createGain();
  sink.gain.value = 0;
  capture.connect(sink).connect(ctx.destination); // keep the node pulled by the graph
  capture.port.onmessage = (e) => onCaptureChunk(e.data);
}

function onCaptureChunk(chunk) {
  if (mode !== "talkback" || !vad) return;
  let s = 0;
  for (let i = 0; i < chunk.length; i++) s += chunk[i] * chunk[i];
  const level = Math.sqrt(s / chunk.length);
  ui.level.style.width = Math.min(100, (level / 0.2) * 100) + "%";
  // Ignore the mic while (and just after) the speaker plays, so it does not hear itself
  if (tbPlaying || performance.now() < tbIgnoreUntil) return;

  const event = vad.push(chunk);
  if (!event) return;
  if (event.type === "start") ui.status.textContent = "● Recording...";
  if (event.type === "cancel") ui.status.textContent = "Listening... say something";
  if (event.type === "end") playTalkback(event.samples);
}

function playTalkback(samples) {
  const buf = ctx.createBuffer(1, samples.length, ctx.sampleRate);
  buf.copyToChannel(samples, 0);
  tbSource = ctx.createBufferSource();
  tbSource.buffer = buf;
  tbSource.connect(nodes.input);
  tbPlaying = true;
  nodes.monitorGain.gain.setTargetAtTime(1, ctx.currentTime, 0.01);
  tbSource.onended = () => {
    if (tbSource) tbSource.disconnect();
    tbSource = null;
    tbPlaying = false;
    tbIgnoreUntil = performance.now() + 300;
    if (mode === "talkback") {
      nodes.monitorGain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
      ui.status.textContent = "Listening... say something";
    }
  };
  tbSource.start();
  ui.status.textContent = "▶ Playing back (" + (samples.length / ctx.sampleRate).toFixed(1) + " s)";
}

function stopTalkbackPlayback() {
  if (tbSource) { tbSource.onended = null; tbSource.stop(); tbSource.disconnect(); tbSource = null; }
  tbPlaying = false;
  if (vad) vad.reset();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll(".modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  ui.talkbackOpts.hidden = m !== "talkback";
  ui.monitorRow.hidden = m === "talkback";
  ui.hint.textContent = HINTS[m];
  if (micSource) routeMic();
}

function applyThresh() {
  const t = +ui.thresh.value;
  $("threshOut").value = t.toFixed(3);
  ui.threshMark.style.left = Math.min(100, (t / 0.2) * 100) + "%";
  if (vad) vad.threshold = t;
}

async function playFile(file) {
  await ensureCtx();
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  if (fileSource) fileSource.stop();
  fileSource = ctx.createBufferSource();
  fileSource.buffer = buf;
  fileSource.connect(nodes.input);
  // Files have no feedback risk: always hear them
  ui.monitor.checked = true; setMonitor();
  if (mode === "talkback") nodes.monitorGain.gain.setTargetAtTime(1, ctx.currentTime, 0.02);
  fileSource.onended = () => {
    fileSource = null; ui.recBtn.disabled = !micStream;
    if (mode === "talkback" && !tbPlaying) nodes.monitorGain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
  };
  fileSource.start();
  ui.recBtn.disabled = false;
  ui.status.textContent = "Playing " + file.name;
}

function toggleRecord() {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  chunks = [];
  recorder = new MediaRecorder(nodes.recDest.stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType });
    ui.player.src = URL.createObjectURL(blob);
    ui.player.hidden = false;
    ui.recBtn.textContent = "● Record";
    ui.status.textContent = "Recorded - press play below";
  };
  recorder.start();
  ui.recBtn.textContent = "■ Stop";
  ui.status.textContent = "Recording...";
}

function setMonitor() {
  if (nodes && mode === "live") nodes.monitorGain.gain.setTargetAtTime(ui.monitor.checked ? 1 : 0, ctx.currentTime, 0.02);
}

function setSpeed(n) {
  setAuto(false);
  ui.rate.value = SPEEDS[n];
  applyParams();
}

// Highlight a preset only when the Power slider sits exactly on it
function markPreset() {
  document.querySelectorAll(".speeds button[data-speed]").forEach((b) => b.classList.toggle("on", !auto && SPEEDS[b.dataset.speed] === +ui.rate.value));
}

// Auto: speed drifts up and down by itself (two slow sines -> uneven, natural swing)
let auto = false, autoT0 = 0;
function setAuto(on) {
  auto = on;
  autoT0 = performance.now();
  $("autoBtn").classList.toggle("on", on);
  markPreset();
}
function autoRate(now) {
  const t = (now - autoT0) / 1000, min = +ui.rate.min, max = +ui.rate.max;
  // Start near the bottom so the first move is a clear spin-up
  const x = 0.6 * -Math.cos((2 * Math.PI * t) / 6) + 0.4 * Math.sin((2 * Math.PI * t) / 2.6);
  return Math.round(((min + max) / 2 + ((max - min) / 2) * 0.9 * x) * 2) / 2;
}

// Blade animation follows chop rate (3 blades -> rate/3 rev per second, slowed for the eye)
let bladeSpeed = 0, angle = 0, last = performance.now();
function spin(now) {
  if (auto && +ui.rate.value !== autoRate(now)) { ui.rate.value = autoRate(now); applyParams(); }
  angle = (angle + (bladeSpeed / 3) * 360 * ((now - last) / 1000) * 0.35) % 360;
  last = now;
  ui.blades.setAttribute("transform", `rotate(${angle} 110 110)`);
  requestAnimationFrame(spin);
}
requestAnimationFrame(spin);

function drawScope() {
  const c = ui.scope, g = c.getContext("2d"), data = new Uint8Array(nodes.analyser.fftSize);
  (function frame() {
    nodes.analyser.getByteTimeDomainData(data);
    g.fillStyle = "#1b2533"; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = "#8ec3e6"; g.lineWidth = 2; g.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = (i / data.length) * c.width, y = (data[i] / 255) * c.height;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
    requestAnimationFrame(frame);
  })();
}

document.querySelectorAll(".speeds button[data-speed]").forEach((b) => b.addEventListener("click", () => setSpeed(+b.dataset.speed)));
$("autoBtn").addEventListener("click", () => setAuto(!auto));
ui.rate.addEventListener("input", () => setAuto(false));
["rate", "depth", "wobble", "wind"].forEach((k) => ui[k].addEventListener("input", applyParams));
ui.micBtn.addEventListener("click", toggleMic);
ui.recBtn.addEventListener("click", toggleRecord);
ui.monitor.addEventListener("change", async () => { await ensureCtx(); setMonitor(); });
ui.file.addEventListener("change", () => ui.file.files[0] && playFile(ui.file.files[0]));
document.querySelectorAll(".modes button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
ui.thresh.addEventListener("input", applyThresh);
applyParams();
applyThresh();
setMode("talkback");
</script>
</body>
</html>
